sample:
  name: UART passthrough
  description: Forwards UART input from P1.10 (RX) to the default console (VCOM).
               Uses a separate DMA region for the input UART to avoid buffer conflicts.
               Blinks LED0 to show the application is running.

tests:
  sample.drivers.uart.uart_passthrough:
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    tags:
      - uart
      - serial
